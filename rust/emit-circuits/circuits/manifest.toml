# Written by noir-zk freeze; do not edit.

noir = "1.0.0-rc.3"
bb = "7.0.0-nightly.20260927"

[library]
name = "emit-protocol"
version = "0.1.0"

# ------------------------------------------------------------ families (hand-written; freeze keeps them)

# The transfer of member_transfer: [ctx, holder_tag, cid, root, N0, N1, C0, C1, C_r, v_in, v_out, fee,
# payout_recipient, note_commitment]; both inputs held by one key, every output 0 or at least 1/3 of the native
# coin, bound to the session's ctx and to the holder tag identity_member published (the same key registered), C_r
# the refund note of the escrowed C0, the rest public, the note payload's commitment its link out.
[[family]]
layer = "emit"
name = "transfer_holder"
members = ["transfer_holder"]
link_out = { index = 13, link = "PayloadCommitment" }
binds = [{ slot = "ctx", index = 0 }, { slot = "holder_tag", index = 1 }]
public_from = 2
slots = ["cid", "root", "n0", "n1", "c0", "c1", "c_r", "v_in", "v_out", "fee", "payout"]

# DG1 sealed for member_transfer: [payload_commitment, ctx, C_t, cid_commit]; continues the membership app's fresh
# DG1 commitment, bound to the session's ctx and C_t, and publishes only a commitment to the ciphertext (which
# travels off-chain; the pool combines cid_commit with the session's ct_commitment into env_commit).
[[family]]
layer = "emit"
name = "dg1_envelope"
members = ["dg1_envelope"]
link_in = { index = 0, link = "PayloadCommitment" }
binds = [{ slot = "ctx", index = 1 }, { slot = "c_t", index = 2 }]
public_from = 3
slots = ["cid_commit"]

# An escrowed note resolved by its owner: [holder_tag, cid, C0, action, c_out, fee]; the tag bound to the one
# identity_member published (the owner is a registered holder), the rest public.
[[family]]
layer = "emit"
name = "escrow_resolve"
members = ["escrow_resolve"]
binds = [{ slot = "holder_tag", index = 0 }]
public_from = 1
slots = ["cid", "c0", "action", "c_out", "fee"]

# The identity cache: prove the passport once (register, after eid's document step), then membership.
# register: [payload_commitment, leaf, expiry]; continues the document's DG1 commitment, leaf and expiry public.
[[family]]
layer = "identity_cache"
name = "register"
members = ["register"]
link_in = { index = 0, link = "PayloadCommitment" }
public_from = 1
slots = ["leaf", "expiry"]

# identity_member: [payload_commitment, identity_root, date, holder_tag]; a fresh commitment to the registered DG1
# for its envelope, the rest public.
[[family]]
layer = "identity_cache"
name = "member"
members = ["identity_member"]
link_out = { index = 0, link = "PayloadCommitment" }
public_from = 1
slots = ["identity_root", "date", "holder_tag"]

# ------------------------------------------------------------ wrapped layers (build.rs: noir_zk_codegen::wrapped)

# The identity layer: eid-circuits v0.8.0 (DSC, SOD and document steps).
[[family]]
layer = "eid"
name = "dsc"
source = "eid-circuits"

[[family]]
layer = "eid"
name = "sod"
source = "eid-circuits"

[[family]]
layer = "eid"
name = "document"
source = "eid-circuits"

# The channel layer: zk-encryption v0.1.1 (its frozen library zk-encryption@0.1.0).
[[family]]
layer = "channel"
name = "session"
source = "zk-encryption"

[[family]]
layer = "channel"
name = "envelope"
source = "zk-encryption"

[[family]]
layer = "channel"
name = "note_envelope"
source = "zk-encryption"

# ------------------------------------------------------------ pipelines
# The session publishes ctx and C_t; the DG1 envelope, the transfer and the
# note envelope are bound to them. The document's DG1 commitment is consumed
# by its envelope before the transfer leaves the note's.

# The passport proved once: the document, then its registration in the identity cache: 6 slots.
[[pipeline]]
name = "identity_register"
positions = ["eid-circuits/eid/dsc", "eid-circuits/eid/sod", "eid-circuits/eid/document", "emit-protocol/identity_cache/register"]

# A transfer by a registered holder: membership (a fresh DG1 commitment, the holder tag), the session, DG1
# sealed (only its commitment public), the transfer bound to the tag, its note opening sealed: 27 slots.
[[pipeline]]
name = "member_transfer"
positions = ["emit-protocol/identity_cache/member", "zk-encryption/channel/session", "emit-protocol/emit/dg1_envelope", "emit-protocol/emit/transfer_holder", "zk-encryption/channel/note_envelope"]

# An escrowed note resolved by its owner, a registered holder: membership, then the resolve: 8 slots.
[[pipeline]]
name = "member_resolve"
positions = ["emit-protocol/identity_cache/member", "emit-protocol/emit/escrow_resolve"]

